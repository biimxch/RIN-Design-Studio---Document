<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RIN – ใบเสนอราคา / ใบแจ้งหนี้ / ใบเสร็จรับเงิน</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--bg:#f4f2ef;--panel:#fff;--ink:#222;--mut:#777;--line:#ddd;--acc:#EC8D5F;--on:#2b1a10}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a19;--panel:#262523;--ink:#eee;--mut:#999;--line:#3a3836}}
:root[data-theme="dark"]{--bg:#1b1a19;--panel:#262523;--ink:#eee;--mut:#999;--line:#3a3836}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Mitr',sans-serif;font-size:14px}
.app{display:grid;grid-template-columns:2fr 3fr;min-height:100vh}
.form{background:var(--panel);padding:18px;overflow-y:auto;height:100vh;position:sticky;top:0;border-right:1px solid var(--line)}
.form h2{margin:0 0 12px;font-size:18px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
details{border:1px solid var(--line);border-radius:8px;margin-top:10px}
summary{cursor:pointer;padding:10px 12px;font-weight:500;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}summary::after{content:'▾';color:var(--mut)}details[open] summary::after{content:'▴'}
details>.b{padding:4px 12px 12px}
details[open]{border-color:var(--acc)}
details[open]>summary{background:var(--acc);color:var(--on);border-radius:7px 7px 0 0}
details[open]>summary::after{color:var(--on)}
#sheet b,#sheet th{font-weight:400}#sheet .ti h1{font-weight:500}
.item{border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px}
.tot{padding:8px 0;font-weight:400}
.chk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--ink)}.chk input{width:auto}.chk input[type=number]{width:76px}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 12px}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--on);font-weight:500}
.x{color:#c44;padding:2px 8px}.add{margin-top:8px}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:8px 4px}.seg button.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.sm{font-size:12px;color:var(--mut);margin-top:8px;word-break:break-all}
.pv{padding:16px;overflow:auto;height:100vh}
.bar{display:flex;gap:8px;justify-content:flex-end;margin:-16px -16px 12px;padding:12px 16px;position:sticky;top:-16px;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar button{background:var(--panel)}.bar button.pri{background:var(--acc)}
.bar button.grn{background:#DFE384;color:#222;border-color:#DFE384}
#wrap{margin:0 auto;width:794px}
#sheet{width:794px;height:1120px;background:#fff;color:#000;padding:56px;position:relative;transform-origin:top left;box-shadow:0 2px 14px rgba(0,0,0,.18);font-size:13px;line-height:1.6;font-weight:300;overflow:hidden}
#sheet .hd{display:flex;justify-content:space-between;align-items:flex-start}
#sheet .logo{width:100px;height:100px;background:#f5f2f1;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:52px;color:#d9c3a5}
#sheet .logo img{max-width:100%;max-height:100%}
#sheet .ti{text-align:right}.ti h1{margin:0 0 8px;font-size:24px}.ti div{margin-bottom:4px}
#sheet .meta{display:flex;justify-content:space-between;margin:34px 0 24px;gap:20px}
#sheet table.t{width:100%;border-collapse:separate;border-spacing:0;border-top:1px solid #444;border-left:1px solid #444}
#sheet .t th,#sheet .t td{border-right:1px solid #444;border-bottom:1px solid #444;padding:6px 10px}
#sheet .t td+td,#sheet .t th+th{text-align:center;width:33%}
#sheet .t .g td{background:#DFE384;font-weight:400}#sheet .t .g td:first-child{text-align:center}
#sheet .t .g.s td{background:rgba(223,227,132,.6)}
#sheet .g2{display:grid;grid-template-columns:165px 1fr;margin-top:24px}#sheet .g2 p{margin:0 0 7px}
#sheet table.pay td{padding:4px 40px 4px 0;vertical-align:top}
#sheet,#sheet *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.red{color:#d32f2f}.pre{white-space:pre-line}
@media (max-width:900px){.app{grid-template-columns:1fr}.form,.pv{height:auto;position:static}}
</style>
</head>
<body>
<div class="app">
<div class="form">
  <h2>สร้างเอกสาร</h2>
  <div class="seg" id="seg"><button data-t="quote">ใบเสนอราคา</button><button data-t="invoice">ใบแจ้งหนี้</button><button data-t="receipt">ใบเสร็จรับเงิน</button></div>

  <details open><summary>ข้อมูลเอกสาร</summary><div class="b">
    <label>ชื่อโครงการ (ใช้ตั้งชื่อไฟล์ PDF)</label><input data-k="project">
    <div class="row"><div><label>เลขที่เอกสาร</label><input id="no"></div><div><label>วันที่ออก</label><input type="date" data-k="date"></div></div>
    <label class="chk" style="margin-top:8px"><input type="checkbox" id="auto"> รันเลขอัตโนมัติ · ลำดับถัดไป <input type="number" id="seq" min="1"></label>
    <div class="sm" id="fn"></div>
  </div></details>

  <details open><summary>ลูกค้า</summary><div class="b">
    <label>ชื่อลูกค้า / บริษัท</label><input data-k="cust">
    <label>ที่อยู่ / ข้อมูลลูกค้า</label><textarea rows="3" data-k="addr"></textarea>
  </div></details>

  <details open><summary>รายการค่าบริการ</summary><div class="b">
    <div id="items"></div>
    <button class="add" id="addIt">+ เพิ่มรายการ</button>
    <div class="tot" style="margin-top:8px">รวมเป็นเงิน <span id="sub"></span> บาท</div>
    <div data-for="invoice receipt"><label>ส่วนลดค่าบริการ (บาท)</label><input type="number" step="0.01" min="0" data-k="disc"></div>
    <div data-for="invoice receipt"><label>หัก ณ ที่จ่าย (%) · คิดจากยอดหลังหักส่วนลด</label><input type="number" step="0.01" min="0" data-k="wht"></div>
  </div></details>

  <details data-for="invoice" open><summary>กำหนดชำระเงิน</summary><div class="b">
    <label>ชำระค่าบริการภายในวันที่</label><input type="date" data-k="due">
  </div></details>

  <details data-for="quote" open><summary>เงื่อนไขการชำระเงิน</summary><div class="b">
    <div id="inst"></div>
    <button class="add" id="addIn">+ เพิ่มงวด</button>
    <div class="sm" id="isum"></div>
  </div></details>

  <details data-for="quote"><summary>หมายเหตุ (ค่าที่แก้ได้)</summary><div class="b">
    <div class="row"><div><label>จำนวนครั้งที่แก้ไขงานได้</label><input type="number" min="0" data-k="rev"></div>
    <div><label>ยืนยันราคาภายใน (วันทำการ)</label><input type="number" min="0" data-k="days"></div></div>
  </div></details>

  <details><summary>ผู้ออกเอกสาร / โลโก้</summary><div class="b">
    <label>ชื่อบริษัท / สตูดิโอ</label><input data-k="company">
    <label>โดย</label><input data-k="by">
    <label>โลโก้ (อัปโหลดเพื่อเปลี่ยน)</label><input type="file" id="logoIn" accept="image/*">
  </div></details>
</div>

<div class="pv" id="pv">
  <div class="bar"><button id="print">พิมพ์ / Save as PDF</button><button class="grn" id="jpg">ดาวน์โหลด JPG</button><button class="pri" id="dl">ดาวน์โหลด PDF</button></div>
  <div id="wrap"><div id="sheet"></div></div>
</div>
</div>

<script>
const ACC={th:'มสฤณา สุวรรณมงคล',en:'Masarina Suwanmongkol',no:'219-8-82363-8',bank:'กสิกรไทย'};
const PF={quote:'QUO',invoice:'INV',receipt:'RCP'};
const TT={quote:['ใบเสนอราคา/QUOTATION','ใบเสนอราคาเลขที่'],invoice:['ใบแจ้งหนี้/INVOICE','ใบแจ้งหนี้เลขที่'],receipt:['ใบเสร็จรับเงิน/RECEIPT','ใบเสร็จรับเงินเลขที่']};
const WHTNOTE='<b>* ผู้ว่าจ้างจะต้องออกหนังสือรับรองการหักภาษี ณ ที่จ่าย (50 ทวิ) ให้ผู้ออกแบบทันทีหลังชำระค่าบริการ</b>';
const D={type:'quote',company:'RIN Design Studio',by:'มสฤณา สุวรรณมงคล',project:'',date:new Date().toLocaleDateString('sv-SE'),cust:'',addr:'',
qItems:[{d:'ค่าบริการออกแบบภายในพื้นที่ ... ตารางเมตร',p:0},{d:'ค่าบริการจัดทำแบบตกแต่งภายใน (แบบเหมาจ่าย)',p:0}],
items:[{d:'ค่าบริการออกแบบภายในงวดที่ 1',p:0}],disc:0,wht:3,due:'',
inst:[{t:'ชำระก่อนเริ่มงาน',p:''},{t:'ชำระก่อนรับไฟล์งานออกแบบฉบับเต็ม',p:''},{t:'ชำระก่อนรับไฟล์ถอดแบบตกแต่งภายใน',p:''}],
rev:4,days:7,auto:true,seq:{quote:1,invoice:1,receipt:1},nos:{quote:'',invoice:'',receipt:''},logo:''};
let S=Object.assign({},D);
try{const s=localStorage.getItem('rin-doc-v3');if(s)S=Object.assign({},D,JSON.parse(s))}catch(e){}

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>parseFloat(v)||0;
const fmt=n=>n.toLocaleString('en-US',{minimumFractionDigits:Number.isInteger(+n.toFixed(2))?0:2,maximumFractionDigits:2});
const thDate=s=>s?new Date(s+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'}):'';
const cur=()=>S.type==='quote'?S.qItems:S.items;
function calc(){const sub=cur().reduce((a,i)=>a+num(i.p),0);const disc=Math.min(Math.max(num(S.disc),0),sub);const after=sub-disc;const wht=Math.round(after*num(S.wht))/100;return{sub,disc,after,wht,total:after-wht}}
function autoNo(){return `${PF[S.type]}-${(S.date||'').replace(/-/g,'').slice(2)}${String(S.seq[S.type]).padStart(3,'0')}`}
const getNo=()=>S.auto?autoNo():S.nos[S.type];
function fileName(){const[y,m,d]=(S.date||'').split('-');const ds=y?d+m+(+y+543):'';const l3=(getNo().match(/\d{3}$/)||[''])[0];
  return[ds,PF[S.type]+l3,S.project.trim()].filter(Boolean).join('_').replace(/[\\/:*?"<>|]/g,'-')}

function renderItems(){
  $('items').innerHTML=cur().map((it,i)=>`<div class="item"><div style="display:flex;gap:6px"><input data-l="it" data-i="${i}" data-f="d" value="${esc(it.d)}" placeholder="รายละเอียด"><button class="x" data-delit="${i}">✕</button></div>
  <label>ราคา (บาท)</label><input type="number" min="0" data-l="it" data-i="${i}" data-f="p" value="${esc(it.p)}"></div>`).join('')}
function renderInst(){
  $('inst').innerHTML=S.inst.map((x,i)=>`<div class="item"><div style="display:flex;gap:6px"><input data-l="in" data-i="${i}" data-f="t" value="${esc(x.t)}"><button class="x" data-delin="${i}">✕</button></div>
  <div class="row"><div><label>สัดส่วน (%)</label><input type="number" min="0" data-l="in" data-i="${i}" data-f="p" value="${esc(x.p)}"></div><div><label>เป็นเงิน (บาท)</label><div class="tot" id="a${i}"></div></div></div></div>`).join('')}
function refresh(){
  const c=calc();$('sub').textContent=fmt(c.sub);
  S.inst.forEach((x,i)=>{const e=$('a'+i);if(e)e.textContent=fmt(c.sub*num(x.p)/100)});
  const sum=S.inst.reduce((a,x)=>a+num(x.p),0);
  $('isum').textContent=`รวมทุกงวด ${fmt(sum)}%`+(sum===100?'':' (ไม่ครบ 100%)');$('isum').style.color=sum===100?'':'#c44';
  if(document.activeElement!==$('no'))$('no').value=getNo();
  $('fn').textContent='ชื่อไฟล์: '+fileName()+'.pdf';
}
const accBlock=()=>`<table class="pay"><tr><td><b>ชื่อบัญชี</b></td><td>${ACC.th}<br>${ACC.en}</td></tr><tr><td><b>เลขที่บัญชี</b></td><td>${ACC.no}</td></tr><tr><td><b>ธนาคาร</b></td><td>${ACC.bank}</td></tr></table>`;

function renderPV(){
  const c=calc(),L=cur(),q=S.type==='quote',inv=S.type==='invoice',rc=S.type==='receipt';
  const logo=S.logo?`<img src="${S.logo}">`:esc((S.company||'LOGO').trim().slice(0,3).toUpperCase());
  const rows=L.map((it,i)=>`<tr><td>${i+1}. ${esc(it.d)}</td><td>${fmt(num(it.p))}</td></tr>`).join('');
  const left=q?`<div><b>เสนอราคาไปยัง :</b> ${esc(S.cust)||'-'}${S.addr?`<div class="pre" style="margin-top:6px">${esc(S.addr)}</div>`:''}</div>`
    :`<div><b>เรียกเก็บเงินไปยัง :</b><div style="margin-top:8px">${esc(S.cust)}</div><div class="pre">${esc(S.addr)}</div></div>`;
  let table,body='';
  if(q){
    table=`<table class="t"><tr><th>รายละเอียด</th><th>ราคา (บาท)</th></tr>${rows}<tr class="g"><td>ราคารวมทั้งหมด</td><td>${fmt(c.sub)}</td></tr></table>`;
    body=`<div class="g2"><b>เงื่อนไขการชำระเงิน :</b><div><p>แบ่งจ่าย ${S.inst.length} งวด ดังนี้</p>${S.inst.map((x,i)=>`<p>งวดที่ ${i+1} ${esc(x.t)} (${fmt(num(x.p))}%) = ${fmt(c.sub*num(x.p)/100)} บาท</p>`).join('')}</div></div>
    <div class="g2"><b>หมายเหตุ :</b><div>
      <p>1. หากผู้ว่าจ้างต้องการชำระและทำสัญญาผ่าน Fastwork จะต้องชำระค่าธรรมเนียมบริการแพลตฟอร์มเพิ่ม 18% ของค่าบริการทั้งหมด คือ ${fmt(Math.round(c.sub*18)/100)} บาท</p>
      <p>2. ผู้ว่าจ้างสามารถแก้ไขงานได้ ${fmt(num(S.rev))} ครั้ง ภายใต้ขอบเขตงานที่ตกลงก่อนการทำสัญญา</p>
      <p>3. ผู้ว่าจ้างต้องยืนยันราคาภายใน ${fmt(num(S.days))} วันทำการ นับจากวันออกใบเสนอราคา</p></div></div>`;
  }else{
    table=`<table class="t"><tr><th>รายละเอียด</th><th>ราคา</th></tr>${rows}<tr><td style="height:34px"></td><td></td></tr>
    <tr class="g s"><td>ส่วนลดค่าบริการ</td><td>-${fmt(c.disc)}</td></tr>
    <tr class="g s"><td>หักภาษี ณ ที่จ่าย ${fmt(num(S.wht))}%</td><td>-${fmt(c.wht)}</td></tr>
    <tr class="g"><td>ราคารวมทั้งหมด (บาท)</td><td>${fmt(c.total)}</td></tr></table>`;
    if(inv)body=`<div style="margin-top:34px"><b>ช่องทางการชำระเงิน</b> <b class="red">* ชำระค่าบริการภายในวันที่ ${thDate(S.due)||'.................'}</b></div><div style="margin-top:8px">${accBlock()}</div>
    <div class="red" style="position:absolute;left:56px;right:56px;bottom:56px">${WHTNOTE}</div>`;
    if(rc)body=`<div style="display:flex;justify-content:space-between;margin-top:34px"><div><b>โอนเงินมายัง :</b><div style="margin-top:8px">${accBlock()}</div></div>
    <div style="text-align:center;width:270px"><div>ลงชื่อ .....................................................</div><div style="margin-top:18px">(${ACC.th})</div><div style="margin-top:8px"><b>ผู้รับเงิน</b></div></div></div>`;
  }
  $('sheet').innerHTML=`<div class="hd"><div class="logo">${logo}</div><div class="ti"><h1>${TT[S.type][0]}</h1><div>${esc(S.company)}</div><div>โดย ${esc(S.by)}</div></div></div>
  <div class="meta">${left}<div style="text-align:right"><div><b>${TT[S.type][1]}/No. : ${esc(getNo())}</b></div><div style="margin-top:8px"><b>วันที่ ${thDate(S.date)}</b></div></div></div>${table}${body}`;
  fit();
}
function fit(){const s=Math.min(1,($('pv').clientWidth-32)/794);$('sheet').style.transform=`scale(${s})`;$('wrap').style.width=794*s+'px';$('wrap').style.height=1120*s+'px'}
function setSeg(){document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.type));
  document.querySelectorAll('[data-for]').forEach(e=>e.hidden=!e.dataset.for.split(' ').includes(S.type))}
const syncSeq=()=>$('seq').value=S.seq[S.type];
function upd(){try{localStorage.setItem('rin-doc-v3',JSON.stringify(S))}catch(e){}refresh();renderPV()}
function bump(){if(S.auto){S.seq[S.type]++;syncSeq();upd()}}

document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='auto'){S.auto=t.checked;return upd()}
  if(t.id==='seq'){S.seq[S.type]=Math.max(1,parseInt(t.value)||1);return upd()}
  if(t.id==='no'){S.auto=false;$('auto').checked=false;S.nos[S.type]=t.value;return upd()}
  if(t.dataset.l){(t.dataset.l==='it'?cur():S.inst)[t.dataset.i][t.dataset.f]=t.value;return upd()}
  if(t.dataset.k){S[t.dataset.k]=t.value;upd()}});
document.addEventListener('click',e=>{const t=e.target;
  if(t.dataset.t){S.type=t.dataset.t;setSeg();renderItems();syncSeq();upd()}
  if(t.dataset.delit!==undefined){cur().splice(t.dataset.delit,1);renderItems();upd()}
  if(t.dataset.delin!==undefined){S.inst.splice(t.dataset.delin,1);renderInst();upd()}});
$('addIt').onclick=()=>{cur().push({d:'',p:0});renderItems();upd()};
$('addIn').onclick=()=>{S.inst.push({t:'',p:0});renderInst();upd()};
$('logoIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.logo=r.result;upd()};r.readAsDataURL(f)};

$('print').onclick=()=>{const sh=$('sheet'),o=sh.style.transform,ot=document.title;sh.style.transform='none';document.title=fileName();
  const st=document.createElement('style');st.textContent='@page{size:A4;margin:0}@media print{body *{visibility:hidden}#sheet,#sheet *{visibility:visible}#sheet{position:fixed;left:0;top:0;box-shadow:none}}';
  document.head.appendChild(st);window.print();st.remove();sh.style.transform=o;document.title=ot;bump()};
function freezeLines(root){
  // html2canvas ตัดบรรทัดภาษาไทยเองแล้วตัวอักษรซ้อนกัน → วัดบรรทัดจริงจาก browser แล้วล็อกด้วย <br> + nowrap
  const seg=new Intl.Segmenter('th',{granularity:'word'});
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];
  while(w.nextNode()){const n=w.currentNode;if(n.nodeValue.trim()&&!/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.nodeName))nodes.push(n)}
  nodes.forEach(n=>{
    const txt=n.nodeValue,parts=[...seg.segment(txt)].map(x=>x.segment),r=document.createRange();
    let pos=0,lines=[],cur='',lastTop=null;
    parts.forEach(p=>{r.setStart(n,pos);r.setEnd(n,pos+p.length);pos+=p.length;
      const rc=r.getClientRects();if(!rc.length){cur+=p;return}
      const top=Math.round(rc[0].top);
      if(lastTop!==null&&Math.abs(top-lastTop)>4){lines.push(cur);cur=''}
      cur+=p;lastTop=top});
    lines.push(cur);
    if(lines.length<2)return;
    const f=document.createDocumentFragment();
    lines.forEach((l,i)=>{const sp=document.createElement('span');sp.style.whiteSpace='nowrap';sp.textContent=l.replace(/^\s+|\s+$/g,'');f.appendChild(sp);if(i<lines.length-1)f.appendChild(document.createElement('br'))});
    n.parentNode.replaceChild(f,n);
  });
}
async function withClone(fn){
  const host=document.createElement('div');
  host.style.cssText='position:fixed;left:0;top:0;width:794px;height:1120px;z-index:-1;background:#fff;overflow:hidden';
  const clone=$('sheet').cloneNode(true);
  clone.style.cssText='transform:none;box-shadow:none;margin:0';
  host.appendChild(clone);document.body.appendChild(host);
  try{
    await document.fonts.ready;await new Promise(r=>setTimeout(r,150));freezeLines(clone);
    await fn(clone);
    bump();
  }catch(err){alert('ดาวน์โหลดไม่สำเร็จ ลองใช้ปุ่ม "พิมพ์ / Save as PDF" แทน')}
  host.remove();
}
const H2C={scale:3,useCORS:true,scrollX:0,scrollY:0,backgroundColor:'#ffffff'};
$('dl').onclick=()=>withClone(clone=>html2pdf().set({margin:0,filename:fileName()+'.pdf',image:{type:'png'},html2canvas:H2C,jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}).from(clone).save());
$('jpg').onclick=()=>withClone(async clone=>{
  const canvas=await html2pdf().set({html2canvas:H2C}).from(clone).toCanvas().get('canvas');
  const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',0.95));
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fileName()+'.jpg';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
});
